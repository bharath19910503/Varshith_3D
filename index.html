<!DOCTYPE html>
<html>
<head>
  <title>Interior Auto-Cover</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .template {
      position: relative;
      width: 600px;
      height: 400px;
      border: 2px solid #ccc;
      background-size: cover;
      background-position: center;
    }
    .overlay {
      position: absolute;
      width: 120px;
      height: auto;
      border: 2px solid #fff;
      cursor: move;
      transform-origin: center center;
    }
    .rotate-handle {
      width: 15px;
      height: 15px;
      background: red;
      border-radius: 50%;
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      cursor: grab;
    }
    #preview { margin-top: 20px; }
  </style>
</head>
<body>
  <h2>Upload Interior Images</h2>
  <input type="file" id="upload1" accept="image/*">
  <input type="file" id="upload2" accept="image/*">
  <input type="file" id="upload3" accept="image/*">
  <select id="category">
    <option value="kitchen">Kitchen</option>
    <option value="bedroom">Bedroom</option>
    <option value="tv_unit">TV Unit</option>
  </select>
  <button onclick="applyTemplate()">Apply Template</button>
  <button onclick="downloadImage()">Download Final Image</button>

  <div id="preview"></div>

  <!-- html2canvas for download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Interact.js for drag/resize/rotate -->
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>

  <script>
    function applyTemplate() {
      const preview = document.getElementById("preview");
      const category = document.getElementById("category").value;

      const container = document.createElement("div");
      container.className = "template";
      container.id = "finalLayout";

      // Set background template
      if (category === "kitchen") {
        container.style.backgroundImage = "url('templates/kitchen_layout.png')";
      } else if (category === "bedroom") {
        container.style.backgroundImage = "url('templates/bedroom_layout.png')";
      } else if (category === "tv_unit") {
        container.style.backgroundImage = "url('templates/tv_layout.png')";
      }

      // Loop through uploads
      [document.getElementById("upload1"), document.getElementById("upload2"), document.getElementById("upload3")]
        .forEach((input, index) => {
          if (input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
              const wrapper = document.createElement("div");
              wrapper.style.position = "absolute";
              wrapper.style.left = (50 + index * 150) + "px";
              wrapper.style.top = "100px";

              const img = document.createElement("img");
              img.src = e.target.result;
              img.className = "overlay";

              const rotateHandle = document.createElement("div");
              rotateHandle.className = "rotate-handle";

              wrapper.appendChild(img);
              wrapper.appendChild(rotateHandle);
              container.appendChild(wrapper);

              // Drag + resize with snap-to-grid
              interact(img)
                .draggable({
                  modifiers: [
                    interact.modifiers.snap({
                      targets: [
                        interact.snappers.grid({ x: 20, y: 20 }) // snap every 20px
                      ],
                      range: Infinity,
                      relativePoints: [{ x: 0, y: 0 }]
                    })
                  ],
                  listeners: {
                    move(event) {
                      const x = (parseFloat(img.getAttribute('data-x')) || 0) + event.dx;
                      const y = (parseFloat(img.getAttribute('data-y')) || 0) + event.dy;
                      img.style.transform = `translate(${x}px, ${y}px) rotate(${img.dataset.angle || 0}deg)`;
                      img.setAttribute('data-x', x);
                      img.setAttribute('data-y', y);
                    }
                  }
                })
                .resizable({
                  edges: { left: true, right: true, bottom: true, top: true },
                  modifiers: [
                    interact.modifiers.snapSize({
                      targets: [
                        interact.snappers.grid({ x: 20, y: 20 }) // snap size to grid
                      ]
                    })
                  ]
                })
                .on('resizemove', event => {
                  Object.assign(event.target.style, {
                    width: `${event.rect.width}px`,
                    height: `${event.rect.height}px`
                  });
                });

              // Rotation control
              interact(rotateHandle).draggable({
                listeners: {
                  move(event) {
                    const rect = img.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    const angle = Math.atan2(event.clientY - centerY, event.clientX - centerX) * 180 / Math.PI;
                    img.dataset.angle = angle;
                    img.style.transform = `translate(${img.dataset.x || 0}px, ${img.dataset.y || 0}px) rotate(${angle}deg)`;
                  }
                }
              });
            };
            reader.readAsDataURL(input.files[0]);
          }
        });

      preview.innerHTML = "";
      preview.appendChild(container);
    }

    function downloadImage() {
      const element = document.getElementById("finalLayout");
      if (!element) {
        alert("Please apply a template first!");
        return;
      }

      html2canvas(element).then(canvas => {
        const link = document.createElement("a");
        link.download = "final_layout.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }
  </script>
</body>
</html>
